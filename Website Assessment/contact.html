    <div class="contact-message">You can contact me with a message...</div>
    <main class="contact-main">
        <form method="get" id="contactMe" class="contact-me">
            <label for="userName">Name</label>
            <input type="text" name="name" id="userName" required>   
            
               
            <label for="userEmail">Email</label>
            <input type="email" name="email" id="userEmail" required> 


            <label for="userRequest">Message</label>
            <textarea id="userRequest" name="request" rows="5" cols="35" 
            placeholder="Hello..." maxlength="1000" required></textarea>
            <button type="submit" id="submitButton" class="submit-button">
                <span>Submit</span>
            </button>
        </form>
